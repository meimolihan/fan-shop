name: release

# 推送 v 开头 tag（由 scripts/build-and-push.sh 打出）时自动：
#   1) 打包自包含源码包（backend/frontend/Dockerfile/scripts/README）创建 GitHub Release
#   2) 构建并推送 multi-arch Docker 镜像（mobufan/fan-shop:latest + 版本标签）
# 一次发版只产生一条 workflow run（jobs: release -> docker）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version file matches tag
        run: |
          grep -q "VERSION = \"v${{ steps.version.outputs.VERSION }}\"" backend/app/version.py \
            || { echo "backend/app/version.py 与 tag 版本不一致，终止发布" >&2; exit 1; }

      # ==================== 打包自包含源码包 ====================
      - name: Assemble source bundle
        run: |
          VER=${{ steps.version.outputs.VERSION }}
          mkdir -p "dist/fan-shop-${VER}"
          cp -r backend frontend "dist/fan-shop-${VER}/"
          cp -r Dockerfile docker-compose.yml README.md "dist/fan-shop-${VER}/"
          cp -r scripts "dist/fan-shop-${VER}/"
          find "dist/fan-shop-${VER}" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find "dist/fan-shop-${VER}" -type f -name '*.pyc' -delete
          tar czf "fan-shop-${VER}.tar.gz" -C dist "fan-shop-${VER}"
          sha256sum "fan-shop-${VER}.tar.gz" > SHA256SUMS
          ls -lh "fan-shop-${VER}.tar.gz"

      # ==================== 创建 GitHub Release ====================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "fan-shop ${{ steps.version.outputs.VERSION }}"
          files: |
            fan-shop-${{ steps.version.outputs.VERSION }}.tar.gz
            SHA256SUMS
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$(sed -n 's/^VERSION = "v\(.*\)"/\1/p' backend/app/version.py | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_IMAGE_NAME || 'mobufan/fan-shop' }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}