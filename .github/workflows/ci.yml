name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_LOG_DIR: ${{ github.workspace }}/.ci-runtime/logs
      BACKUP_DIR: ${{ github.workspace }}/.ci-runtime/backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r backend/requirements.txt ruff
      - run: mkdir -p "${APP_LOG_DIR}" "${BACKUP_DIR}"
      - run: python -m py_compile backend/app/*.py
      - run: python -m unittest discover -s tests
      - run: ruff check backend tests
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: node --test tests/test_ai_chat.mjs tests/test_ai_widget.mjs
      - run: find frontend/src -name '*.js' -print0 | xargs -0 -n1 node --check
