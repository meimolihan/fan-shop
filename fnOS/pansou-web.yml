services:
  pansou-web:
    image: ghcr.io/fish2018/pansou-web:latest
    container_name: pansou-web
    ports:
      - 8888:80
    environment:
      - PANSOU_PORT=8888
      - CACHE_PATH=/app/data/cache
      - LOG_PATH=/app/data/logs
      - AUTH_ENABLED=true
      - AUTH_USERS=admin:password
      - AUTH_TOKEN_EXPIRY=24
      - AUTH_JWT_SECRET=72d2f01e7819c365894b2136ac70d24807f297097e857034d82577d91234abcd
    volumes:
      - /vol1/1000/Docker/pansou-web:/app/data
    restart: always
    network_mode: bridge
